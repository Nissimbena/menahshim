name: Deploy PRODUCTION (letscoach.net/hapoel-jerusalem) from main

# Production only ever receives what was already tested on the `test` branch:
# main is protected (PR + owner approval) and this workflow refuses to deploy
# unless main is byte-for-byte identical to test. It uses the
# "letscoach-production" environment, restricted to the main branch, which
# holds the secret LETSCOACH_DEPLOY_SA_KEY (environment secret).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: letscoach-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require that main equals the tested test branch
        run: |
          git fetch origin test
          if ! git diff --quiet origin/test HEAD; then
            echo "::error::main differs from test. Promote with a pull request from test to main - nothing goes to production without passing through test."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc
      - run: npx vite build --base=/hapoel-jerusalem/ --outDir dist-subpath
      - name: Get a Google access token straight from the service-account key
        env:
          SA_KEY: ${{ secrets.LETSCOACH_DEPLOY_SA_KEY }}
        run: |
          umask 077
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json"
          TOKEN="$(gcloud auth print-access-token)"
          echo "::add-mask::$TOKEN"
          echo "ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Deploy only /hapoel-jerusalem/ (rest of letscoach.net untouched)
        env:
          SITE: letscoachfront
          SUBPATH: hapoel-jerusalem
          DIST_DIR: dist-subpath
        run: node scripts/deploy-subpath.mjs
